name: Scrape IPL Points & Deploy

on:
  schedule:
    # 11:30 PM IST = 18:00 UTC — runs after every match day
    - cron: "0 18 * * *"
  workflow_dispatch:   # manual trigger from GitHub Actions tab

env:

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo

        uses: actions/checkout@v4.2.2


      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q google-chrome-stable

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated leaderboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Auto-update: IPL points $(date +'%d %b %Y %H:%M IST')"
          git push
