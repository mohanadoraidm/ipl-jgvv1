<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPL 2026 Auction Leaderboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#f0f0f0;min-height:100vh}
.hdr{background:linear-gradient(135deg,#1a0800,#2d1200);padding:1.2rem 1rem;text-align:center;border-bottom:2px solid #f97316;position:sticky;top:0;z-index:10}
.hdr h1{font-size:1.3rem;font-weight:800}
.hdr-sub{font-size:11px;color:#aaa;margin-top:2px}
.upd{font-size:11px;color:#f97316;margin-top:3px}
.box{max-width:480px;margin:0 auto;padding:1rem}

/* HOME */
.team-card{background:#161616;border:1px solid #252525;border-radius:12px;padding:1rem 1.2rem;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s,transform .15s}
.team-card:hover{border-color:#f97316;transform:translateX(4px)}
.team-logo{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#111;flex-shrink:0}
.team-info{flex:1;min-width:0}
.team-name-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.tname{font-size:15px;font-weight:700}
.bw{height:5px;background:#222;border-radius:3px}
.bf{height:5px;border-radius:3px;transition:width .6s}
.arrow{color:#555;font-size:18px;flex-shrink:0}
.team-pts{font-size:1.2rem;font-weight:800;text-align:right;flex-shrink:0}
.pos{color:#22c55e}.neg{color:#ef4444}.zero{color:#888}
.saved-tag{font-size:10px;background:#22c55e22;color:#22c55e;border-radius:4px;padding:2px 6px}
.medal{font-size:1.3rem;width:26px;text-align:center;flex-shrink:0}

/* TEAM PAGE */
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#f97316;font-size:14px;font-weight:600;cursor:pointer;padding:0;margin-bottom:1rem}
.team-header{display:flex;align-items:center;gap:12px;background:#161616;border:1px solid #252525;border-radius:10px;padding:12px 14px;margin-bottom:1rem}
.team-header img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#111}
.team-header-name{font-size:17px;font-weight:700}
.team-header-sub{font-size:11px;color:#666;margin-top:3px}
.sel-bar{background:#161616;border:1px solid #333;border-radius:8px;padding:10px 14px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:72px;z-index:5;gap:8px}
.sel-count{font-size:13px;color:#aaa;white-space:nowrap}
.sel-count span{color:#f97316;font-weight:700;font-size:16px}
.btn-row{display:flex;gap:6px;flex-shrink:0}
.auto-btn{background:#f97316;color:#000;border:none;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.auto-btn:hover{background:#fb923c}
.save-btn{background:#22c55e;color:#000;border:none;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.save-btn:disabled{background:#2a2a2a;color:#555;cursor:not-allowed}
.player-row{background:#161616;border:1px solid #252525;border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .15s,background .15s}
.player-row:hover{border-color:#444}
.player-row.selected{border-color:#22c55e;background:#071a0d}
.player-row.locked{opacity:0.3;cursor:not-allowed;pointer-events:none}
.chk{width:20px;height:20px;border-radius:5px;border:2px solid #444;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:#000;transition:all .15s}
.chk.on{background:#22c55e;border-color:#22c55e}
.pname{flex:1;font-size:13px;font-weight:500}
.pnet{font-size:13px;font-weight:700;min-width:52px;text-align:right}
.pbase{font-size:10px;color:#555;text-align:right}
.stitle{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.1em;margin:.5rem 0 .75rem}
.spin{text-align:center;padding:3rem;color:#444;font-size:14px}
.note{font-size:11px;color:#444;text-align:center;margin-top:1rem;padding-bottom:2rem}
</style>
</head>
<body>

<div class="hdr">
  <h1>🏏 IPL 2026 Auction</h1>
  <div class="hdr-sub">Pick 11 players per team · Net points since 8 May</div>
  <div class="upd" id="upd">Loading...</div>
</div>

<div class="box">
  <div id="home-page"><div class="spin">Fetching leaderboard...</div></div>
  <div id="team-page" style="display:none"></div>
</div>

<script>
let DATA = null;
let currentTeam = null;

const MEDALS = ['🥇','🥈','🥉'];
const RC = ['r1','r2','r3'];

const TEAM_META = {
  RR:  { color:'#e11d48', logo:'https://documents.iplt20.com/ipl/RR/logos/Logooutline/RRoutline.png' },
  CSK: { color:'#eab308', logo:'https://documents.iplt20.com/ipl/CSK/logos/Logooutline/CSKoutline.png' },
  MI:  { color:'#1d4ed8', logo:'https://documents.iplt20.com/ipl/MI/logos/Logooutline/MIoutline.png' },
  RCB: { color:'#b91c1c', logo:'https://documents.iplt20.com/ipl/RCB/logos/Logooutline/RCBoutline.png' },
  SRH: { color:'#ea580c', logo:'https://documents.iplt20.com/ipl/SRH/logos/Logooutline/SRHoutline.png' },
};

// Handle both old field names (net_pts/baseline_pts) and new (net/base)
function pNet(p)  { return p.net  ?? p.net_pts      ?? 0; }
function pBase(p) { return p.base ?? p.baseline_pts ?? 0; }

function getSelections(team) {
  try { return JSON.parse(localStorage.getItem('ipl_sel_' + team)) || []; }
  catch { return []; }
}
function saveSelections(team, arr) {
  localStorage.setItem('ipl_sel_' + team, JSON.stringify(arr));
}

function teamScore(teamData) {
  const sel = getSelections(teamData.team);
  if (sel.length === 11) {
    return teamData.players
      .filter(p => sel.includes(p.name))
      .reduce((s, p) => s + pNet(p), 0);
  }
  return teamData.total ?? teamData.total_net_pts ?? 0;
}

function renderHome() {
  if (!DATA) return;
  document.getElementById('upd').textContent = 'Updated: ' + DATA.updated;

  const lb = DATA.leaderboard.map(t => ({
    ...t,
    display_score: Math.round(teamScore(t) * 10) / 10
  })).sort((a, b) => b.display_score - a.display_score);

  const maxAbs = Math.max(...lb.map(t => Math.abs(t.display_score)), 1);
  let h = '<div class="stitle">Leaderboard — tap team to pick your 11</div>';

  lb.forEach((t, i) => {
    const n = t.display_score;
    const neg = n < 0, cls = neg ? 'neg' : n === 0 ? 'zero' : 'pos';
    const sign = n > 0 ? '+' : '';
    const pct = Math.round(Math.abs(n) / maxAbs * 100);
    const sel = getSelections(t.team);
    const meta = TEAM_META[t.team] || { color:'#888', logo:'' };
    const savedTag = sel.length === 11 ? '<span class="saved-tag">✓ 11 picked</span>' : '';

    h += `<div class="team-card" onclick="openTeam('${t.team}')" style="border-left:4px solid ${meta.color}">
      <div class="medal">${MEDALS[i] || i+1}</div>
      <img class="team-logo" src="${meta.logo}" onerror="this.style.display='none'" alt="${t.team}">
      <div class="team-info">
        <div class="team-name-row">
          <span class="tname" style="color:${meta.color}">${t.team}</span>
          ${savedTag}
        </div>
        <div class="bw"><div class="bf" style="width:${pct}%;background:${neg?'#ef4444':meta.color}"></div></div>
      </div>
      <div style="text-align:right;margin-left:4px">
        <div class="team-pts ${cls}">${sign}${n.toFixed(1)}</div>
        <div style="font-size:10px;color:#555;margin-top:2px">${sel.length===11?'11 players':'full 25'}</div>
      </div>
      <div class="arrow">›</div>
    </div>`;
  });

  h += '<div class="note">Scores update daily after each match day 🏏</div>';
  document.getElementById('home-page').innerHTML = h;
}

function openTeam(teamName) {
  currentTeam = teamName;
  document.getElementById('home-page').style.display = 'none';
  document.getElementById('team-page').style.display = 'block';
  renderTeamPage();
}

function autoPickBest() {
  const teamData = DATA.leaderboard.find(t => t.team === currentTeam);
  const top11 = [...teamData.players]
    .sort((a, b) => pNet(b) - pNet(a))
    .slice(0, 11)
    .map(p => p.name);
  saveSelections(currentTeam, top11);
  renderTeamPage();
}

function clearSelection() {
  saveSelections(currentTeam, []);
  renderTeamPage();
}

function renderTeamPage() {
  const teamData = DATA.leaderboard.find(t => t.team === currentTeam);
  const selected = getSelections(currentTeam);
  const count = selected.length;
  const meta = TEAM_META[currentTeam] || { color:'#888', logo:'' };

  const players = [...teamData.players].sort((a, b) => {
    const aS = selected.includes(a.name);
    const bS = selected.includes(b.name);
    if (aS && !bS) return -1;
    if (!aS && bS) return 1;
    return pNet(b) - pNet(a);
  });

  const rows = players.map(p => {
    const isSel = selected.includes(p.name);
    const isLocked = !isSel && count >= 11;
    const net = pNet(p), base = pBase(p);
    const netCls = net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero';
    const sign = net > 0 ? '+' : '';
    const safeName = p.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="player-row ${isSel?'selected':isLocked?'locked':''}" onclick="togglePlayer('${safeName}')">
      <div class="chk ${isSel?'on':''}">${isSel?'✓':''}</div>
      <div class="pname">${p.name}</div>
      <div style="text-align:right">
        <div class="pnet ${netCls}">${sign}${net.toFixed(1)}</div>
        <div class="pbase">base: ${base.toFixed(1)}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('team-page').innerHTML = `
    <button class="back-btn" onclick="goHome()">← Back to leaderboard</button>
    <div class="team-header">
      <img src="${meta.logo}" onerror="this.style.display='none'" alt="${currentTeam}">
      <div>
        <div class="team-header-name" style="color:${meta.color}">${currentTeam}</div>
        <div class="team-header-sub">Select your best 11 players</div>
      </div>
    </div>
    <div class="sel-bar">
      <div class="sel-count">Selected: <span>${count}</span> / 11</div>
      <div class="btn-row">
        <button class="auto-btn" onclick="autoPickBest()">⚡ Auto</button>
        <button class="auto-btn" style="background:#334155;color:#94a3b8" onclick="clearSelection()">✕ Clear</button>
        <button class="save-btn" onclick="saveTeam()" ${count===11?'':'disabled'}>${count===11?'✓ Save':'Pick 11'}</button>
      </div>
    </div>
    <div class="stitle">${currentTeam} — tap to select · sorted by net points</div>
    <div id="player-list">${rows}</div>`;
}

function togglePlayer(name) {
  let sel = getSelections(currentTeam);
  if (sel.includes(name)) sel = sel.filter(n => n !== name);
  else { if (sel.length >= 11) return; sel.push(name); }
  saveSelections(currentTeam, sel);
  renderTeamPage();
}

function saveTeam() {
  if (getSelections(currentTeam).length !== 11) { alert('Select exactly 11!'); return; }
  alert('✅ ' + currentTeam + ' squad saved!');
  goHome();
}

function goHome() {
  document.getElementById('team-page').style.display = 'none';
  document.getElementById('home-page').style.display = 'block';
  renderHome();
}

fetch('data.json?v=' + Date.now())
  .then(r => r.json())
  .then(d => { DATA = d; renderHome(); })
  .catch(() => {
    document.getElementById('home-page').innerHTML =
      '<div class="spin">⚠️ Run the scraper first via GitHub Actions</div>';
  });
</script>
</body>
</html>
