<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPL 2026 Auction Leaderboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#f0f0f0;min-height:100vh}
.header{background:linear-gradient(135deg,#1a0600,#2d1000);padding:1.5rem 1rem;text-align:center;border-bottom:2px solid #ff6600}
h1{font-size:1.5rem;font-weight:800}
.sub{font-size:12px;color:#aaa;margin-top:4px}
.upd{font-size:11px;color:#ff9933;margin-top:4px}
.box{max-width:680px;margin:0 auto;padding:1rem}
.stitle{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.1em;margin:1.2rem 0 .6rem}
.lbc{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:.85rem 1rem;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.lbc.r1{border-left:4px solid #f59e0b}
.lbc.r2{border-left:4px solid #9ca3af}
.lbc.r3{border-left:4px solid #b45309}
.rnk{font-size:1.3rem;width:28px;text-align:center;flex-shrink:0}
.bdg{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.RR{background:#e91e63;color:#fff}.CSK{background:#f9c400;color:#000}
.MI{background:#004ba0;color:#fff}.RCB{background:#c8102e;color:#fff}.SRH{background:#f4552c;color:#fff}
.bw{height:6px;background:#222;border-radius:3px;flex:1;margin:0 8px}
.bf{height:6px;border-radius:3px;transition:width .8s}
.pts{font-size:1.1rem;font-weight:800;min-width:72px;text-align:right}
.pos{color:#22c55e}.neg{color:#ef4444}.zer{color:#888}
.rc{background:#1a1a1a;border:1px solid #222;border-radius:10px;margin-bottom:8px;overflow:hidden}
.rh{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.rh:hover{background:#1f1f1f}
.rb{display:none;padding:0 14px 8px}
.rb.open{display:block}
.pr{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid #1e1e1e;font-size:12px}
.pr:last-child{border:none}
.pn{flex:1;color:#ccc}
.pb{font-size:11px;color:#555;min-width:72px;text-align:right}
.pv{min-width:62px;text-align:right;font-weight:700;font-size:12px}
.spin{text-align:center;padding:3rem;color:#555}
</style>
</head>
<body>
<div class="header">
  <h1>🏏 IPL 2026 Auction Leaderboard</h1>
  <div class="sub">ESPNcricinfo Impact Points · Net gain since 8 May 2026</div>
  <div class="upd" id="upd">Loading...</div>
</div>
<div class="box">
  <div id="app"><div class="spin">Fetching leaderboard...</div></div>
</div>
<script>
const M=['🥇','🥈','🥉'],RC=['r1','r2','r3'];
const C={RR:'#e91e63',CSK:'#f9c400',MI:'#004ba0',RCB:'#c8102e',SRH:'#f4552c'};

fetch('data.json?v='+Date.now())
.then(r=>r.json())
.then(d=>{
  document.getElementById('upd').textContent='Updated: '+d.updated_at;
  const lb=d.leaderboard;
  const mx=Math.max(...lb.map(t=>Math.abs(t.total)),1);
  let h='<div class="stitle">Standings — net points since auction</div>';

  lb.forEach((t,i)=>{
    const n=t.total,neg=n<0,cls=neg?'neg':n===0?'zer':'pos',s=n>0?'+':'';
    const pct=Math.round(Math.abs(n)/mx*100);
    h+=`<div class="lbc ${RC[i]||''}">
      <div class="rnk">${M[i]||i+1}</div>
      <span class="bdg ${t.team}">${t.team}</span>
      <div class="bw"><div class="bf" style="width:${pct}%;background:${neg?'#ef4444':C[t.team]}"></div></div>
      <div class="pts ${cls}">${s}${n.toFixed(1)}</div>
    </div>`;
  });

  h+='<div class="stitle">Team Rosters</div>';
  lb.forEach(t=>{
    const n=t.total,s=n>=0?'+':'',cls=n>0?'pos':n<0?'neg':'zer';
    const rows=t.players.map(p=>{
      const pc=p.net>0?'pos':p.net<0?'neg':'zer',ps=p.net>0?'+':'';
      return `<div class="pr"><div class="pn">${p.name}</div><div class="pb">base:${p.baseline.toFixed(1)}</div><div class="pv ${pc}">${ps}${p.net.toFixed(1)}</div></div>`;
    }).join('');
    h+=`<div class="rc"><div class="rh" onclick="tog(this)"><span><span class="bdg ${t.team}">${t.team}</span> <span class="${cls}" style="margin-left:8px;font-weight:700">${s}${n.toFixed(1)} pts</span></span><span>▼</span></div><div class="rb">${rows}</div></div>`;
  });

  document.getElementById('app').innerHTML=h;
})
.catch(()=>{
  document.getElementById('app').innerHTML='<div class="spin">⚠️ Run the scraper first via GitHub Actions</div>';
});

function tog(el){const b=el.nextElementSibling;b.classList.toggle('open');el.querySelector('span:last-child').textContent=b.classList.contains('open')?'▲':'▼';}
</script>
</body>
</html>
