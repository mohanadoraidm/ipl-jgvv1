<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL 2026 Auction Leaderboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}
  .header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:2rem 1rem 1.5rem;text-align:center;border-bottom:1px solid #1D9E75}
  .header h1{font-size:1.6rem;font-weight:700;color:#fff}
  .header p{font-size:13px;color:#9ca3af;margin-top:4px}
  .updated{font-size:12px;color:#1D9E75;margin-top:6px}
  .container{max-width:700px;margin:0 auto;padding:1.5rem 1rem}
  .lb-card{background:#111;border:1px solid #222;border-radius:12px;padding:1rem 1.25rem;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:transform 0.15s}
  .lb-card:hover{transform:translateX(4px)}
  .lb-card.rank-1{border-color:#f59e0b}
  .lb-card.rank-2{border-color:#9ca3af}
  .lb-card.rank-3{border-color:#b45309}
  .rank{font-size:1.4rem;width:36px;text-align:center}
  .team-name{flex:1;font-size:1.1rem;font-weight:600}
  .pts{font-size:1.25rem;font-weight:700;color:#1D9E75}
  .pts.negative{color:#ef4444}
  .bar-wrap{height:5px;background:#222;border-radius:3px;flex:1}
  .bar{height:5px;background:#1D9E75;border-radius:3px;transition:width 0.8s ease}
  .section-title{font-size:14px;font-weight:600;color:#9ca3af;margin:1.5rem 0 0.75rem;text-transform:uppercase;letter-spacing:.08em}
  .roster-card{background:#111;border:1px solid #1e1e1e;border-radius:10px;margin-bottom:12px;overflow:hidden}
  .roster-header{padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:#161616}
  .roster-header h3{font-size:15px;font-weight:600}
  .roster-body{display:none;padding:0 14px 10px}
  .roster-body.open{display:block}
  .player-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid #1e1e1e;font-size:13px}
  .player-row:last-child{border:none}
  .pname{flex:1;color:#e5e7eb}
  .pbase{color:#6b7280;min-width:70px;text-align:right;font-size:12px}
  .pnet{min-width:70px;text-align:right;font-weight:600}
  .pnet.pos{color:#1D9E75}
  .pnet.neg{color:#ef4444}
  .pnet.zero{color:#6b7280}
  .arrow{font-size:12px;color:#6b7280;margin-left:8px}
  .spinner{text-align:center;padding:3rem;color:#6b7280}
  .tag{font-size:10px;background:#1D9E75;color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>

<div class="header">
  <h1>🏏 IPL 2026 Auction Leaderboard</h1>
  <p>Based on ESPNcricinfo Impact Points · Points from auction date only</p>
  <div class="updated" id="updated">Loading...</div>
</div>

<div class="container">
  <div id="app"><div class="spinner">Loading leaderboard...</div></div>
</div>

<script>
const MEDALS = ['🥇','🥈','🥉'];
const RANK_CLASS = ['rank-1','rank-2','rank-3'];

fetch('data.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('updated').textContent = 'Last updated: ' + data.updated_at;
    const maxPts = Math.max(...data.leaderboard.map(t => Math.abs(t.total_net_pts)), 1);

    let lb = '<div class="section-title">Standings</div>';
    data.leaderboard.forEach((t, i) => {
      const neg = t.total_net_pts < 0;
      lb += `<div class="lb-card ${RANK_CLASS[i]||''}">
        <div class="rank">${MEDALS[i] || i+1}</div>
        <div class="team-name">${t.team}</div>
        <div style="flex:2;padding:0 12px">
          <div class="bar-wrap"><div class="bar" style="width:${Math.round(Math.abs(t.total_net_pts)/maxPts*100)}%;background:${neg?'#ef4444':'#1D9E75'}"></div></div>
        </div>
        <div class="pts ${neg?'negative':''}">${t.total_net_pts > 0 ? '+' : ''}${t.total_net_pts.toFixed(1)}</div>
      </div>`;
    });

    lb += '<div class="section-title">Team Rosters</div>';
    data.leaderboard.forEach(t => {
      const players = data.teams[t.team] || [];
      const rows = players.map(p => {
        const cls = p.net_pts > 0 ? 'pos' : p.net_pts < 0 ? 'neg' : 'zero';
        const sign = p.net_pts > 0 ? '+' : '';
        return `<div class="player-row">
          <div class="pname">${p.name}${p.espn_name !== p.name && p.espn_name !== '—' ? '<span class="tag">matched</span>' : ''}</div>
          <div class="pbase" title="Baseline pts">base: ${p.baseline_pts.toFixed(1)}</div>
          <div class="pnet ${cls}">${sign}${p.net_pts.toFixed(1)}</div>
        </div>`;
      }).join('');
      lb += `<div class="roster-card">
        <div class="roster-header" onclick="toggle(this)">
          <h3>${t.team} <span style="color:#1D9E75">+${t.total_net_pts.toFixed(1)} pts</span></h3>
          <span class="arrow">▼</span>
        </div>
        <div class="roster-body">${rows}</div>
      </div>`;
    });

    document.getElementById('app').innerHTML = lb;
  })
  .catch(() => {
    document.getElementById('app').innerHTML = '<div class="spinner">Failed to load data.json — run the scraper first.</div>';
  });

function toggle(el) {
  const body = el.nextElementSibling;
  body.classList.toggle('open');
  el.querySelector('.arrow').textContent = body.classList.contains('open') ? '▲' : '▼';
}
</script>
</body>
</html>
